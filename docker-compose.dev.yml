services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shicai
      MYSQL_USER: sc
      MYSQL_PASSWORD: scpass
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
volumes:
  mysql-data:
